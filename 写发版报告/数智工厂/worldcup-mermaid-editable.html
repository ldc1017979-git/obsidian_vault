<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>世界杯流程图 Mermaid 可编辑版</title>
  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";

    mermaid.initialize({
      startOnLoad: false,
      securityLevel: "loose",
      theme: "base",
      themeVariables: {
        fontFamily: "Inter, Microsoft YaHei, system-ui, sans-serif",
        primaryColor: "#eef6ff",
        primaryBorderColor: "#2563eb",
        primaryTextColor: "#1f2937",
        lineColor: "#64748b",
        tertiaryColor: "#fff7ed"
      },
      flowchart: {
        htmlLabels: true,
        curve: "basis"
      }
    });

    const defaultCode = `flowchart TB
  A([赛事启动<br/>48 支球队参赛]) --> B[抽签分组<br/>12 个小组，每组 4 队]
  B --> C[小组赛<br/>组内单循环，每队 3 场]
  C --> D{小组排名结果？}

  D -->|每组前 2 名| E[24 队直接晋级]
  D -->|第 3 名| F[第三名横向比较]
  D -.->|第 4 名| G[小组赛出局]

  F --> H{是否为最佳 8 个第三名？}
  H -->|是| I[进入 32 强]
  H -.->|否| G
  E --> I

  I --> J[32 强淘汰赛<br/>单场定胜负]
  J -->|胜者| K[16 强]
  K -->|胜者| L[1/4 决赛]
  L -->|胜者| M{半决赛结果？}

  M -->|胜者| N[决赛]
  M -.->|负者| O[三四名决赛<br/>决出季军]
  N --> P([产生世界杯冠军])

  classDef start fill:#dbeafe,stroke:#2563eb,color:#1e3a8a,stroke-width:2px;
  classDef process fill:#ffffff,stroke:#94a3b8,color:#1f2937,stroke-width:1.5px;
  classDef decision fill:#fef3c7,stroke:#d97706,color:#78350f,stroke-width:2px;
  classDef muted fill:#f8fafc,stroke:#cbd5e1,color:#64748b,stroke-dasharray:5 4;
  classDef gold fill:#fef9c3,stroke:#ca8a04,color:#713f12,stroke-width:2px;

  class A start;
  class B,C,E,F,I,J,K,L,N process;
  class D,H,M decision;
  class G,O muted;
  class P gold;`;

    const editor = document.querySelector("#editor");
    const preview = document.querySelector("#preview");
    const status = document.querySelector("#status");
    const renderButton = document.querySelector("#render");
    const resetButton = document.querySelector("#reset");
    const downloadButton = document.querySelector("#download");

    editor.value = localStorage.getItem("worldcup-mermaid-code") || defaultCode;

    async function render() {
      const code = editor.value.trim();
      localStorage.setItem("worldcup-mermaid-code", code);
      preview.innerHTML = "";
      status.textContent = "正在渲染...";

      try {
        const id = "worldcup-flow-" + Date.now();
        const { svg } = await mermaid.render(id, code);
        preview.innerHTML = svg;
        status.textContent = "已渲染，可继续编辑";
      } catch (error) {
        preview.innerHTML = `<pre class="error">${String(error.message || error)}</pre>`;
        status.textContent = "语法有误，请检查 Mermaid 源码";
      }
    }

    function downloadMermaid() {
      const blob = new Blob([editor.value], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "worldcup-flowchart.mmd";
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    renderButton.addEventListener("click", render);
    resetButton.addEventListener("click", () => {
      editor.value = defaultCode;
      render();
    });
    downloadButton.addEventListener("click", downloadMermaid);
    editor.addEventListener("input", () => {
      clearTimeout(window.__renderTimer);
      window.__renderTimer = setTimeout(render, 450);
    });

    render();
  </script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7fb;
      --panel: rgba(255, 255, 255, 0.82);
      --line: rgba(148, 163, 184, 0.55);
      --text: #172033;
      --muted: #64748b;
      --blue: #2563eb;
      --blue-dark: #1d4ed8;
      --gold: #d97706;
      --shadow: 0 18px 50px rgba(15, 23, 42, 0.10);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, "Microsoft YaHei", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        linear-gradient(135deg, rgba(37, 99, 235, 0.08), transparent 34%),
        linear-gradient(225deg, rgba(217, 119, 6, 0.08), transparent 34%),
        var(--bg);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 22px 28px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(18px);
    }

    h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: 0;
    }

    .subtitle {
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    button {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 14px;
      color: var(--text);
      background: #fff;
      font-size: 14px;
      cursor: pointer;
    }

    button.primary {
      color: #fff;
      border-color: var(--blue);
      background: var(--blue);
    }

    button:hover {
      border-color: var(--blue-dark);
    }

    main {
      display: grid;
      grid-template-columns: minmax(360px, 0.9fr) minmax(520px, 1.25fr);
      gap: 18px;
      padding: 18px;
      height: calc(100vh - 86px);
    }

    section {
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
    }

    #editor {
      width: 100%;
      height: calc(100% - 43px);
      display: block;
      resize: none;
      border: 0;
      outline: 0;
      padding: 18px;
      color: #182235;
      background: rgba(255, 255, 255, 0.64);
      font: 14px/1.58 Consolas, "Cascadia Code", "Microsoft YaHei", monospace;
    }

    #preview-wrap {
      overflow: auto;
    }

    #preview {
      min-width: 900px;
      min-height: calc(100% - 43px);
      padding: 32px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }

    #preview svg {
      max-width: 100%;
      height: auto;
    }

    .error {
      width: 100%;
      padding: 16px;
      border: 1px solid #fecaca;
      border-radius: 8px;
      white-space: pre-wrap;
      color: #991b1b;
      background: #fff1f2;
    }

    @media (max-width: 980px) {
      header {
        align-items: flex-start;
        flex-direction: column;
      }

      main {
        grid-template-columns: 1fr;
        height: auto;
      }

      section {
        min-height: 520px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>2026 世界杯赛事流程图</h1>
      <div class="subtitle">编辑左侧 Mermaid 源码，右侧自动预览。无需后端，双击此 HTML 文件即可打开。</div>
    </div>
    <div class="actions">
      <button id="reset" type="button">恢复默认</button>
      <button id="download" type="button">导出 Mermaid</button>
      <button id="render" class="primary" type="button">重新渲染</button>
    </div>
  </header>
  <main>
    <section>
      <div class="section-head">
        <span>Mermaid 源码</span>
        <span>可直接复制到 Mermaid Live</span>
      </div>
      <textarea id="editor" spellcheck="false"></textarea>
    </section>
    <section id="preview-wrap">
      <div class="section-head">
        <span>流程图预览</span>
        <span id="status">准备渲染</span>
      </div>
      <div id="preview"></div>
    </section>
  </main>
</body>
</html>
