<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>叉车员库位操作 · 优化原型</title>
<style>
:root{--blue:#2458f5;--blue-bg:#eef3ff;--text:#222b3a;--muted:#8b96a8;--line:#e5e9f0;--bg:#f5f7fa;--orange:#f4a43b;--green:#2fb683;--red:#ee6464}
*{box-sizing:border-box}body{margin:0;background:#dfe3e8;font:14px/1.45 "Microsoft YaHei","PingFang SC",sans-serif;color:var(--text)}button,input,select{font:inherit}
.device{width:min(1180px,100vw);height:min(690px,100vh);min-height:600px;margin:auto;background:#fff;overflow:hidden;position:relative;box-shadow:0 12px 40px #313b4b33}.page{display:none;height:100%}.page.active{display:flex}
.login{align-items:center;justify-content:center;background:linear-gradient(135deg,#f7faff,#eef4ff)}.login-card{width:480px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:36px 48px;box-shadow:0 16px 38px #304d8120}.login-brand{text-align:center;margin-bottom:28px}.login-brand h1{font-size:24px;color:var(--blue);margin:0 0 7px}.login-brand p{color:var(--muted);margin:0}.form-row{margin:16px 0}.form-row label{display:block;color:#687385;margin-bottom:7px}.input{width:100%;height:42px;border:1px solid #d7dde7;border-radius:5px;padding:0 12px;background:#fff}.input:focus{border-color:#7295ff;outline:3px solid #e8eeff}.remember{display:flex;align-items:center;color:#7d8798;font-size:12px;margin:8px 0 22px}.btn{height:40px;border:1px solid transparent;border-radius:4px;padding:0 24px;cursor:pointer}.btn.primary{background:var(--blue);color:#fff}.btn.secondary{background:#fff;border-color:#d7dde7;color:#637083}.btn.camera-btn{background:#1f2733;color:#fff}.btn:disabled{background:#cbd2dd;color:#fff;cursor:not-allowed}.login-card .primary{width:100%}
.app{flex-direction:column;background:var(--bg)}.top{height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px}.brand{font-size:17px;font-weight:700;color:var(--blue)}.brand small{font-size:11px;color:#9aa4b4;font-weight:400;margin-left:9px}.user{margin-left:auto;display:flex;align-items:center;gap:12px;color:#687385}.avatar{width:30px;height:30px;border-radius:50%;background:var(--blue-bg);color:var(--blue);display:grid;place-items:center;font-weight:700}.logout{border:0;background:transparent;color:#8c96a6;cursor:pointer}
.workspace{height:calc(100% - 56px);display:flex;flex-direction:column}.tools{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px;gap:14px}.tools label{color:#7f8999}.tools select{height:36px;min-width:150px;border:1px solid #d8dee7;border-radius:4px;padding:0 10px}.status-tip{margin-left:auto;color:#7e8999}.status-tip b{color:var(--blue)}
.zone-tabs{height:45px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:end;padding:0 22px;gap:3px;overflow-x:auto}.zone{height:39px;border:0;background:transparent;padding:0 16px;color:#7f899a;white-space:nowrap;cursor:pointer;border-bottom:2px solid transparent}.zone.active{color:var(--blue);border-bottom-color:var(--blue);background:#f8faff}
.content{display:grid;grid-template-columns:1fr 290px;gap:16px;padding:16px 22px 20px;min-height:0;flex:1}.map-card,.side-card{background:#fff;border:1px solid var(--line);border-radius:7px}.map-card{padding:20px;display:flex;flex-direction:column;min-width:0}.map-head{display:flex;align-items:center}.map-head h2{font-size:17px;margin:0}.legend{margin-left:24px;display:flex;gap:14px;color:#7e8998;font-size:12px}.sw{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-2px;margin-right:4px}.sw.free{background:#d9dde3}.sw.occupied{background:#555b63}.sw.locked{background:#ef7278}.map-actions{margin-left:auto}.rack-wrap{flex:1;display:flex;align-items:flex-start;padding-top:48px}.rack-grid{display:grid;grid-template-columns:52px repeat(6,72px);gap:10px}.col{color:#919aaa;text-align:center;height:25px}.row-label{height:46px;background:#edf5ff;color:#4a91e8;border-radius:5px;display:grid;place-items:center;font-size:16px}.rack{height:46px;border:0;border-radius:5px;background:#d7d9dd;cursor:pointer;position:relative}.rack:hover{transform:translateY(-1px);box-shadow:0 4px 10px #34405420}.rack.occupied{background:#555b63}.rack.locked{background:#ef7278}.rack.selected{box-shadow:0 0 0 3px #2d70f5}.rack.selected:after{content:"已选";position:absolute;right:4px;top:4px;background:#2d70f5;color:#fff;font-size:10px;padding:2px 4px;border-radius:2px}
.side-card{padding:20px;overflow:auto}.side-card h2{font-size:16px;margin:0 0 16px;border-left:3px solid var(--blue);padding-left:8px}.empty{text-align:center;color:#a0a8b5;padding:80px 0}.details.hidden{display:none}.kv{display:grid;grid-template-columns:74px 1fr;gap:8px;padding:9px 0;border-bottom:1px solid #f0f2f5}.kv label{color:#909aaa}.status{color:#fff;background:#555b63;border-radius:3px;padding:3px 8px;font-size:12px}.side-card .primary{width:100%;margin-top:18px}.side-note{font-size:11px;color:#9ca5b2;margin-top:9px}
.overlay{position:absolute;inset:0;background:#18213199;display:none;align-items:center;justify-content:center;z-index:10}.overlay.open{display:flex}.dialog{width:720px;max-height:600px;background:#fff;border-radius:8px;box-shadow:0 18px 60px #18213155;display:flex;flex-direction:column;overflow:hidden}.dialog-head{height:58px;display:flex;align-items:center;padding:0 22px;border-bottom:1px solid var(--line)}.dialog-head h2{font-size:17px;margin:0}.close{margin-left:auto;border:0;background:transparent;color:#7e8998;cursor:pointer;font-size:18px}.dialog-body{padding:20px 22px;overflow:auto}.dialog-foot{height:66px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:flex-end;gap:12px;padding:0 22px}.summary{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:5px;overflow:hidden}.summary div{padding:12px;border-right:1px solid var(--line)}.summary div:last-child{border:0}.summary label{display:block;color:#929baa;font-size:11px;margin-bottom:4px}.section-title{font-size:15px;font-weight:600;margin:18px 0 10px}.qty-row{display:flex;align-items:center;gap:12px}.qty-row input{width:150px}.diff{color:#df5555}.photo-area{display:grid;grid-template-columns:210px 1fr;gap:16px}.camera-panel{height:160px;background:#202733;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#dfe4ec}.camera-panel p{font-size:11px;color:#98a2b2;margin:5px 0 13px}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.photo{height:110px;border:1px dashed #ccd3de;border-radius:5px;background:#fafbfc;position:relative;overflow:hidden}.photo.filled{border-style:solid;background-image:url('assets/warehouse-evidence-triptych.png');background-size:300% 100%;background-repeat:no-repeat}.photo[data-i="0"]{background-position:0}.photo[data-i="1"]{background-position:50%}.photo[data-i="2"]{background-position:100%}.delete{position:absolute;right:4px;top:4px;border:0;background:#1e2632cc;color:#fff;border-radius:3px;font-size:10px;padding:3px 6px;cursor:pointer}.rule{margin-top:10px;background:#f6f8fb;padding:10px 12px;border-radius:4px;color:#788396;font-size:12px}.rule b{color:#566173}.error{color:#d94e4e;font-size:12px;min-height:18px;margin-top:6px}.toast{position:absolute;top:70px;left:50%;transform:translateX(-50%);background:#fff;border:1px solid var(--line);box-shadow:0 8px 24px #34405433;border-radius:4px;padding:10px 18px;opacity:0;pointer-events:none;transition:.18s;z-index:20}.toast.show{opacity:1}
@media(max-width:900px){.device{min-width:820px}.rack-grid{grid-template-columns:48px repeat(6,58px)}.content{grid-template-columns:1fr 265px;padding-left:14px;padding-right:14px}}
</style>
</head>
<body><main class="device">
<section class="page login active" id="loginPage"><div class="login-card"><div class="login-brand"><h1>AGV 智能叉车</h1><p>叉车员平板作业端</p></div><div class="form-row"><label for="userName">用户名</label><input class="input" id="userName" value="18702540396"></div><div class="form-row"><label for="password">密码</label><input class="input" id="password" type="password" value="18702540396"></div><label class="remember"><input type="checkbox" checked> 记住账号</label><button class="btn primary" id="loginBtn">登录</button></div></section>
<section class="page app" id="appPage"><header class="top"><div class="brand">AGV 智能叉车<small>平板作业端</small></div><div class="user"><span>叉车员：张伟</span><div class="avatar">张</div><button class="logout" id="logoutBtn">退出</button></div></header><div class="workspace">
<div class="tools"><label>车间</label><select><option>江苏2车间</option><option>江苏1车间</option></select><label>库区视图</label><span>J2纸板区</span><span class="status-tip">请先选择深灰色的 <b>占用库位</b></span></div>
<nav class="zone-tabs"><button class="zone">A区</button><button class="zone">B区</button><button class="zone">F1加工区</button><button class="zone">G1铁板区</button><button class="zone">H1空罐区</button><button class="zone">J1纸板区</button><button class="zone active">J2纸板区</button><button class="zone">K1顶盖区</button></nav>
<div class="content"><section class="map-card"><div class="map-head"><h2>库位图</h2><div class="legend"><span><i class="sw free"></i>空闲</span><span><i class="sw occupied"></i>占用</span><span><i class="sw locked"></i>锁闭</span></div></div><div class="rack-wrap"><div class="rack-grid"><span></span><span class="col">1</span><span class="col">2</span><span class="col">3</span><span class="col">4</span><span class="col">5</span><span class="col">6</span><span class="row-label">1</span><button class="rack locked"></button><button class="rack locked"></button><button class="rack"></button><button class="rack"></button><button class="rack"></button><button class="rack"></button><span class="row-label">2</span><button class="rack"></button><button class="rack occupied" data-id="J2-02-02"></button><button class="rack occupied" data-id="J2-02-03"></button><button class="rack"></button><button class="rack"></button><button class="rack"></button></div></div></section>
<aside class="side-card"><h2>库位信息</h2><div class="empty" id="emptyState">请选择一个库位查看详情</div><div class="details hidden" id="details"><div class="kv"><label>库位</label><strong id="locationId">J2-02-02</strong></div><div class="kv"><label>当前状态</label><span><i class="status">占用</i></span></div><div class="kv"><label>物料</label><span>纸板-A型</span></div><div class="kv"><label>占用库存</label><strong id="sideQty">120 件</strong></div><div class="kv"><label>叉车员</label><span id="sideOperator">—</span></div><div class="kv"><label>上传时间</label><span id="sideTime">—</span></div><button class="btn primary" id="modifyBtn">修改占用库存</button><div class="side-note">修改时必须现场拍摄1～3张照片</div></div></aside></div></div></section>
<div class="overlay" id="overlay"><div class="dialog" role="dialog" aria-modal="true" aria-label="修改占用库存"><div class="dialog-head"><h2>修改占用库存</h2><button class="close" id="closeDialog">关闭</button></div><div class="dialog-body"><div class="summary"><div><label>库区</label><strong>J2纸板区</strong></div><div><label>库位</label><strong id="dialogLocation">J2-02-02</strong></div><div><label>物料</label><strong>纸板-A型</strong></div><div><label>当前库存</label><strong>120件</strong></div></div><div class="section-title">调整库存</div><div class="qty-row"><label for="newQty">实际库存数量</label><input class="input" id="newQty" type="number" min="0" value="108"><span>差异：<b class="diff">-12件</b></span></div><div class="section-title">现场照片 <span style="color:#df5555">*</span> <small id="photoCount" style="color:var(--blue)">0/3</small></div><div class="photo-area"><div class="camera-panel"><strong>现场拍照</strong><p>请拍摄当前库位和物料</p><button class="btn camera-btn" id="takePhoto">拍照</button></div><div><div class="photos"><div class="photo" data-i="0"></div><div class="photo" data-i="1"></div><div class="photo" data-i="2"></div></div><div class="rule"><b>拍照规则：</b>最少1张、最多3张；仅允许调用相机，不提供相册选择。</div><div class="error" id="photoError"></div></div></div></div><div class="dialog-foot"><button class="btn secondary" id="cancelBtn">取消</button><button class="btn primary" id="confirmBtn" disabled>确认提交</button></div></div></div>
<div class="toast" id="toast"></div></main>
<script>
const loginPage=document.getElementById('loginPage'),appPage=document.getElementById('appPage'),toast=document.getElementById('toast');function tip(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1400)}
document.getElementById('loginBtn').onclick=()=>{if(!userName.value||!password.value){tip('请输入用户名和密码');return}loginPage.classList.remove('active');appPage.classList.add('active')};document.getElementById('logoutBtn').onclick=()=>{appPage.classList.remove('active');loginPage.classList.add('active')};
const racks=[...document.querySelectorAll('.rack')],details=document.getElementById('details'),emptyState=document.getElementById('emptyState');let chosen='';racks.forEach(r=>r.onclick=()=>{racks.forEach(x=>x.classList.remove('selected'));r.classList.add('selected');if(r.classList.contains('occupied')){chosen=r.dataset.id;locationId.textContent=chosen;dialogLocation.textContent=chosen;details.classList.remove('hidden');emptyState.style.display='none'}else{chosen='';details.classList.add('hidden');emptyState.style.display='block';emptyState.textContent='当前库位非占用，无需展示上传信息'}});
document.querySelectorAll('.zone').forEach(z=>z.onclick=()=>{document.querySelectorAll('.zone').forEach(x=>x.classList.remove('active'));z.classList.add('active');tip('已切换库区视图')});
const overlay=document.getElementById('overlay');modifyBtn.onclick=()=>overlay.classList.add('open');function close(){overlay.classList.remove('open')}closeDialog.onclick=close;cancelBtn.onclick=close;overlay.onclick=e=>{if(e.target===overlay)close()};
let photos=0;const slots=[...document.querySelectorAll('.photo')],confirmBtn=document.getElementById('confirmBtn');function refresh(){photoCount.textContent=photos+'/3';slots.forEach((s,i)=>{s.classList.toggle('filled',i<photos);s.innerHTML=i<photos?'<button class="delete" data-delete>删除</button>':''});confirmBtn.disabled=photos<1;photoError.textContent=photos<1?'请至少拍摄1张现场照片':'';document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=e=>{e.stopPropagation();photos--;refresh()})}
takePhoto.onclick=()=>{if(photos>=3){photoError.textContent='最多只能拍摄3张照片';return}photos++;refresh();photoError.textContent='';tip('照片已拍摄')};newQty.oninput=()=>{const n=Number(newQty.value);document.querySelector('.diff').textContent=Number.isFinite(n)?(n-120)+'件':'—'};
confirmBtn.onclick=()=>{if(photos<1)return;const btn=confirmBtn;btn.disabled=true;btn.textContent='提交中…';setTimeout(()=>{sideQty.textContent=newQty.value+' 件';sideOperator.textContent='张伟（FC-018）';sideTime.textContent='2026-07-21 10:45:30';btn.textContent='确认提交';btn.disabled=false;close();tip('占用库存修改成功');photos=0;refresh()},650)};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&overlay.classList.contains('open'))close()});
</script></body></html>
