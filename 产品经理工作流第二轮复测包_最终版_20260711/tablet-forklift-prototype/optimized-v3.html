<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>叉车员批量修改库位状态</title>
<style>
:root{--blue:#2458f5;--blue-bg:#eef3ff;--text:#222b3a;--muted:#8b96a8;--line:#e5e9f0;--bg:#f5f7fa;--red:#ee6b72;--dark:#565c64}
*{box-sizing:border-box}body{margin:0;background:#dfe3e8;font:14px/1.45 "Microsoft YaHei","PingFang SC",sans-serif;color:var(--text)}button,input,select{font:inherit}.device{width:min(1180px,100vw);height:min(690px,100vh);min-height:600px;margin:auto;background:#fff;overflow:hidden;position:relative;box-shadow:0 12px 40px #313b4b33}.page{display:none;height:100%}.page.active{display:flex}
.login{align-items:center;justify-content:center;background:linear-gradient(135deg,#f7faff,#eef4ff)}.login-card{width:480px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:36px 48px;box-shadow:0 16px 38px #304d8120}.login-brand{text-align:center;margin-bottom:28px}.login-brand h1{font-size:24px;color:var(--blue);margin:0 0 7px}.login-brand p{color:var(--muted);margin:0}.row{margin:16px 0}.row label{display:block;color:#687385;margin-bottom:7px}.input{width:100%;height:42px;border:1px solid #d7dde7;border-radius:5px;padding:0 12px}.input:focus{border-color:#7295ff;outline:3px solid #e8eeff}.remember{display:flex;align-items:center;color:#7d8798;font-size:12px;margin:8px 0 22px}.btn{height:40px;border:1px solid transparent;border-radius:4px;padding:0 24px;cursor:pointer}.btn.primary{background:var(--blue);color:#fff}.btn.secondary{background:#fff;border-color:#d7dde7;color:#637083}.btn.camera-btn{background:#1f2733;color:#fff}.btn:disabled{background:#cbd2dd;color:#fff;cursor:not-allowed}.login-card .primary{width:100%}
.app{flex-direction:column;background:var(--bg)}.top{height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px}.brand{font-size:17px;font-weight:700;color:var(--blue)}.brand small{font-size:11px;color:#9aa4b4;font-weight:400;margin-left:9px}.user{margin-left:auto;display:flex;align-items:center;gap:12px;color:#687385}.avatar{width:30px;height:30px;border-radius:50%;background:var(--blue-bg);color:var(--blue);display:grid;place-items:center;font-weight:700}.logout{border:0;background:transparent;color:#8c96a6;cursor:pointer}.workspace{height:calc(100% - 56px);display:flex;flex-direction:column}
.tools{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px;gap:14px}.tools label{color:#7f8999}.tools select{height:36px;min-width:150px;border:1px solid #d8dee7;border-radius:4px;padding:0 10px}.selection{margin-left:auto;display:flex;align-items:center;gap:12px}.selected-count{background:var(--blue-bg);color:var(--blue);padding:8px 13px;border-radius:16px}.zone-tabs{height:45px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:end;padding:0 22px;gap:3px;overflow-x:auto}.zone{height:39px;border:0;background:transparent;padding:0 16px;color:#7f899a;white-space:nowrap;cursor:pointer;border-bottom:2px solid transparent}.zone.active{color:var(--blue);border-bottom-color:var(--blue);background:#f8faff}
.content{padding:16px 22px 20px;min-height:0;flex:1}.map-card{height:100%;background:#fff;border:1px solid var(--line);border-radius:7px;padding:20px;display:flex;flex-direction:column}.map-head{display:flex;align-items:center}.map-head h2{font-size:17px;margin:0}.helper{margin-left:18px;color:#8b95a5;font-size:12px}.legend{margin-left:auto;display:flex;gap:14px;color:#7e8998;font-size:12px}.sw{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-2px;margin-right:4px}.sw.free{background:#d9dde3}.sw.occupied{background:var(--dark)}.sw.locked{background:var(--red)}.sw.chosen{background:#fff;border:3px solid var(--blue)}.rack-wrap{flex:1;display:flex;align-items:flex-start;padding-top:48px}.rack-grid{display:grid;grid-template-columns:54px repeat(8,76px);gap:11px}.col{color:#919aaa;text-align:center;height:25px}.row-label{height:48px;background:#edf5ff;color:#4a91e8;border-radius:5px;display:grid;place-items:center;font-size:16px}.rack{height:48px;border:0;border-radius:5px;background:#d7d9dd;cursor:pointer;position:relative;transition:.15s}.rack.free:hover{transform:translateY(-1px);box-shadow:0 4px 10px #34405420}.rack.occupied{background:var(--dark);cursor:not-allowed}.rack.locked{background:var(--red);cursor:not-allowed}.rack.selected{background:#fff;box-shadow:0 0 0 3px var(--blue)}.rack.selected:after{content:"已选";position:absolute;inset:0;display:grid;place-items:center;color:var(--blue);font-weight:700}.map-foot{border-top:1px solid #f0f2f5;padding-top:14px;color:#8c96a6;font-size:12px}.map-foot b{color:#586274}
.overlay{position:absolute;inset:0;background:#18213199;display:none;align-items:center;justify-content:center;z-index:10}.overlay.open{display:flex}.dialog{width:730px;background:#fff;border-radius:8px;box-shadow:0 18px 60px #18213155;display:flex;flex-direction:column;overflow:hidden}.dialog-head{height:58px;display:flex;align-items:center;padding:0 22px;border-bottom:1px solid var(--line)}.dialog-head h2{font-size:17px;margin:0}.close{margin-left:auto;border:0;background:transparent;color:#7e8998;cursor:pointer}.dialog-body{padding:20px 22px}.section-title{font-size:15px;font-weight:600;margin:0 0 10px}.batch-summary{display:grid;grid-template-columns:1fr 1fr;gap:12px}.summary-box{border:1px solid var(--line);border-radius:5px;padding:13px}.summary-box label{display:block;color:#909aaa;font-size:11px;margin-bottom:5px}.target{display:inline-block;background:#eef3ff;color:var(--blue);padding:4px 10px;border-radius:3px}.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:7px}.chip{background:#f3f5f8;border:1px solid #e1e6ed;padding:4px 9px;border-radius:3px}.photo-title{font-size:15px;font-weight:600;margin:18px 0 10px}.photo-area{display:grid;grid-template-columns:210px 1fr;gap:16px}.camera-panel{height:160px;background:#202733;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#dfe4ec}.camera-panel p{font-size:11px;color:#98a2b2;margin:5px 0 13px}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.photo{height:110px;border:1px dashed #ccd3de;border-radius:5px;background:#fafbfc;position:relative;overflow:hidden}.photo.filled{border-style:solid;background-image:url('assets/warehouse-evidence-triptych.png');background-size:300% 100%;background-repeat:no-repeat}.photo[data-i="0"]{background-position:0}.photo[data-i="1"]{background-position:50%}.photo[data-i="2"]{background-position:100%}.delete{position:absolute;right:4px;top:4px;border:0;background:#1e2632cc;color:#fff;border-radius:3px;font-size:10px;padding:3px 6px;cursor:pointer}.rule{margin-top:10px;background:#f6f8fb;padding:10px 12px;border-radius:4px;color:#788396;font-size:12px}.rule b{color:#566173}.error{color:#d94e4e;font-size:12px;min-height:18px;margin-top:6px}.dialog-foot{height:66px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:flex-end;gap:12px;padding:0 22px}.toast{position:absolute;top:70px;left:50%;transform:translateX(-50%);background:#fff;border:1px solid var(--line);box-shadow:0 8px 24px #34405433;border-radius:4px;padding:10px 18px;opacity:0;pointer-events:none;transition:.18s;z-index:20}.toast.show{opacity:1}
@media(max-width:960px){.device{min-width:840px}.rack-grid{grid-template-columns:50px repeat(8,61px)}}
</style></head>
<body><main class="device">
<section class="page login active" id="loginPage"><div class="login-card"><div class="login-brand"><h1>AGV 智能叉车</h1><p>叉车员平板作业端</p></div><div class="row"><label>用户名</label><input class="input" id="userName" value="18702540396"></div><div class="row"><label>密码</label><input class="input" id="password" type="password" value="18702540396"></div><label class="remember"><input type="checkbox" checked> 记住账号</label><button class="btn primary" id="loginBtn">登录</button></div></section>
<section class="page app" id="appPage"><header class="top"><div class="brand">AGV 智能叉车<small>平板作业端</small></div><div class="user"><span>叉车员：张伟</span><div class="avatar">张</div><button class="logout" id="logoutBtn">退出</button></div></header><div class="workspace"><div class="tools"><label>车间</label><select><option>江苏2车间</option><option>江苏1车间</option></select><label>库区视图</label><span>J2纸板区</span><div class="selection"><span class="selected-count">已选 <b id="selectedCount">0</b> 个库位</span><button class="btn primary" id="modifyBtn" disabled>修改库位状态</button></div></div>
<nav class="zone-tabs"><button class="zone">A区</button><button class="zone">B区</button><button class="zone">F1加工区</button><button class="zone">G1铁板区</button><button class="zone">H1空罐区</button><button class="zone">J1纸板区</button><button class="zone active">J2纸板区</button><button class="zone">K1顶盖区</button></nav>
<div class="content"><section class="map-card"><div class="map-head"><h2>库位图</h2><span class="helper">可多选空闲库位；占用、锁闭状态不可编辑</span><div class="legend"><span><i class="sw free"></i>空闲（可选）</span><span><i class="sw occupied"></i>占用</span><span><i class="sw locked"></i>锁闭</span><span><i class="sw chosen"></i>已选</span></div></div><div class="rack-wrap"><div class="rack-grid"><span></span><span class="col">1</span><span class="col">2</span><span class="col">3</span><span class="col">4</span><span class="col">5</span><span class="col">6</span><span class="col">7</span><span class="col">8</span>
<span class="row-label">1</span><button class="rack locked" data-id="J2-01-01"></button><button class="rack free" data-id="J2-01-02"></button><button class="rack free" data-id="J2-01-03"></button><button class="rack free" data-id="J2-01-04"></button><button class="rack occupied" data-id="J2-01-05"></button><button class="rack free" data-id="J2-01-06"></button><button class="rack free" data-id="J2-01-07"></button><button class="rack free" data-id="J2-01-08"></button>
<span class="row-label">2</span><button class="rack free" data-id="J2-02-01"></button><button class="rack occupied" data-id="J2-02-02"></button><button class="rack occupied" data-id="J2-02-03"></button><button class="rack free" data-id="J2-02-04"></button><button class="rack free" data-id="J2-02-05"></button><button class="rack free" data-id="J2-02-06"></button><button class="rack locked" data-id="J2-02-07"></button><button class="rack free" data-id="J2-02-08"></button></div></div><div class="map-foot"><b>操作说明：</b>点击空闲库位进行多选，再点击右上方“修改库位状态”。本次选择将统一修改为占用状态。</div></section></div></div></section>
<div class="overlay" id="overlay"><div class="dialog" role="dialog" aria-modal="true" aria-label="修改库位状态"><div class="dialog-head"><h2>修改库位状态</h2><button class="close" id="closeDialog">关闭</button></div><div class="dialog-body"><div class="batch-summary"><div class="summary-box"><label>已选择库位</label><strong><span id="dialogCount">0</span> 个空闲库位</strong><div class="chips" id="chips"></div></div><div class="summary-box"><label>目标状态</label><strong class="target">占用</strong><div style="font-size:11px;color:#929baa;margin-top:8px">目标状态固定，不可选择其他状态</div></div></div><div class="photo-title">现场照片 <span style="color:#d94e4e">*</span> <small id="photoCount" style="color:var(--blue)">0/3</small></div><div class="photo-area"><div class="camera-panel"><strong>现场拍照</strong><p>请拍摄所选库位现场情况</p><button class="btn camera-btn" id="takePhoto">拍照</button></div><div><div class="photos"><div class="photo" data-i="0"></div><div class="photo" data-i="1"></div><div class="photo" data-i="2"></div></div><div class="rule"><b>拍照规则：</b>本次批量修改共用1～3张照片；仅允许拍照，不提供相册选择。</div><div class="error" id="photoError"></div></div></div></div><div class="dialog-foot"><button class="btn secondary" id="cancelBtn">取消</button><button class="btn primary" id="confirmBtn">完成并修改库位状态</button></div></div></div><div class="toast" id="toast"></div>
</main><script>
const loginPage=document.getElementById('loginPage'),appPage=document.getElementById('appPage'),toast=document.getElementById('toast');function tip(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1400)}
loginBtn.onclick=()=>{if(!userName.value||!password.value){tip('请输入用户名和密码');return}loginPage.classList.remove('active');appPage.classList.add('active')};logoutBtn.onclick=()=>{appPage.classList.remove('active');loginPage.classList.add('active')};
const selected=new Set(),freeRacks=[...document.querySelectorAll('.rack.free')];function refreshSelection(){selectedCount.textContent=selected.size;modifyBtn.disabled=selected.size<1;freeRacks.forEach(r=>r.classList.toggle('selected',selected.has(r.dataset.id)))}freeRacks.forEach(r=>r.onclick=()=>{selected.has(r.dataset.id)?selected.delete(r.dataset.id):selected.add(r.dataset.id);refreshSelection()});document.querySelectorAll('.rack:not(.free)').forEach(r=>r.onclick=()=>tip('仅空闲状态库位可以修改'));
document.querySelectorAll('.zone').forEach(z=>z.onclick=()=>{document.querySelectorAll('.zone').forEach(x=>x.classList.remove('active'));z.classList.add('active');tip('已切换库区视图')});
const overlay=document.getElementById('overlay');modifyBtn.onclick=()=>{dialogCount.textContent=selected.size;chips.innerHTML=[...selected].map(x=>'<span class="chip">'+x+'</span>').join('');photoError.textContent='';overlay.classList.add('open')};function close(){overlay.classList.remove('open')}closeDialog.onclick=close;cancelBtn.onclick=close;overlay.onclick=e=>{if(e.target===overlay)close()};
let photos=0;const slots=[...document.querySelectorAll('.photo')];function refreshPhotos(){photoCount.textContent=photos+'/3';slots.forEach((s,i)=>{s.classList.toggle('filled',i<photos);s.innerHTML=i<photos?'<button class="delete">删除</button>':''});document.querySelectorAll('.delete').forEach(b=>b.onclick=e=>{e.stopPropagation();photos--;refreshPhotos()})}takePhoto.onclick=()=>{if(photos>=3){photoError.textContent='最多只能拍摄3张照片';return}photos++;refreshPhotos();photoError.textContent='';tip('照片已拍摄')};
confirmBtn.onclick=()=>{if(photos<1){photoError.textContent='请至少拍摄1张现场照片，未上传照片不可提交';return}const btn=confirmBtn;btn.disabled=true;btn.textContent='提交中…';setTimeout(()=>{freeRacks.filter(r=>selected.has(r.dataset.id)).forEach(r=>{r.classList.remove('free','selected');r.classList.add('occupied');r.onclick=()=>tip('仅空闲状态库位可以修改')});const n=selected.size;selected.clear();refreshSelection();photos=0;refreshPhotos();btn.disabled=false;btn.textContent='完成并修改库位状态';close();tip('已将'+n+'个库位修改为占用状态')},650)};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&overlay.classList.contains('open'))close()});
</script></body></html>
