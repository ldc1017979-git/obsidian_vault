<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大批次查询｜最终体验填写表</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#303133;font:14px/1.6 "Microsoft YaHei",sans-serif}.top{height:58px;background:#1c53d9;color:#fff;display:flex;align-items:center;padding:0 28px}.top b{font-size:18px}.top span{margin-left:14px;opacity:.8}.wrap{max-width:980px;margin:20px auto;padding:0 18px}.card{background:#fff;border:1px solid #e4e7ed;border-radius:6px;padding:22px;margin-bottom:16px}.head{display:flex;align-items:center;gap:12px}.head h1{font-size:22px;margin:0}.tag{color:#409eff;background:#ecf5ff;padding:3px 8px;border-radius:3px}.hint{color:#606266}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{margin-top:14px}.field label{display:block;color:#606266;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid #dcdfe6;border-radius:4px;padding:9px 10px;background:#fff}.field textarea{min-height:96px;resize:vertical}.required:before{content:'*';color:#f56c6c;margin-right:4px}.evidence{background:#f5f7fa;border:1px solid #e4e7ed;padding:12px 15px;border-radius:4px}.evidence li{margin:5px 0}.actions{position:sticky;bottom:0;background:#fff;border-top:1px solid #e4e7ed;padding:14px 0;display:flex;gap:10px;justify-content:flex-end}.btn{border:1px solid #dcdfe6;background:#fff;border-radius:4px;padding:8px 16px;cursor:pointer}.btn.primary{background:#409eff;border-color:#409eff;color:#fff}.status{margin-right:auto;color:#67c23a}@media(max-width:720px){.grid{grid-template-columns:1fr}}
</style></head><body><header class="top"><b>数智工厂 · 大批次查询</b><span>第二轮复测｜最终体验填写表</span></header><main class="wrap"><section class="card"><div class="head"><h1>最终体验与负责人结论</h1><span class="tag">由东超本人填写</span></div><p class="hint">本页为Codex兼容静态填写版，不运行脚本、不自动保存、不下载文件。请填写后截图或复制内容交回。</p><div class="grid"><div class="field"><label>填写人</label><input id="reviewer" value="东超"></div><div class="field"><label>日期</label><input id="date" type="date" value="2026-07-15"></div></div></section><section class="card"><h2>客观证据摘要</h2><ul class="evidence"><li>PRD V0.3门禁PASS，P0/P1为0。</li><li>V1.1全量原型测试23 PASS / 0 FAIL。</li><li>V1.2修复与核心回归7 PASS / 0 FAIL。</li><li>业务UAT由东超于2026-07-15签收通过。</li><li>真实系统目前尚未开发本功能，生产性能与上线UAT未覆盖。</li></ul></section><form id="form" class="card"><h2>最终体验</h2><div class="grid"><div class="field"><label class="required">本次结果分级</label><select name="result" required=""><option value="">请选择</option><option selected="selected">A 通过</option><option>B 少量调整</option><option>C 继续修正</option><option>D 不可推广</option></select></div><div class="field"><label class="required">强引导能力</label><select name="guidance" required=""><option value="">请选择</option><option selected="selected">通过</option><option>部分通过</option><option>不通过</option></select></div><div class="field"><label class="required">系统基线适配</label><select name="baseline" required=""><option value="">请选择</option><option selected="selected">通过</option><option>部分通过</option><option>不通过</option></select></div><div class="field"><label class="required">HTML原型生成能力</label><select name="prototype" required=""><option value="">请选择</option><option>通过</option><option selected="selected">部分通过</option><option>不适用</option><option>不通过</option></select></div><div class="field"><label class="required">是否继续推广</label><select name="promote" required=""><option value="">请选择</option><option selected="selected">是</option><option>否</option><option>调整后再推广</option></select></div><div class="field"><label class="required">是否需要改工作流</label><select name="workflowChange" required=""><option value="">请选择</option><option selected="selected">是</option><option>否</option></select></div><div class="field"><label class="required">是否愿意在真实项目继续使用</label><select name="reuse" required=""><option value="">请选择</option><option selected="selected">是</option><option>否</option><option>有条件使用</option></select></div><div class="field"><label class="required">相比原工作方式是否减少返工</label><select name="rework" required=""><option value="">请选择</option><option>明显减少</option><option selected="selected">略有减少</option><option>无变化</option><option>增加</option></select></div></div><div class="field"><label class="required">最有价值的环节</label><textarea name="mostValuable" required="" placeholder="请填写你认为最有价值的环节及原因">不需要真正了解整体业务需求，就可以按照提示进行回答，比较详细</textarea></div><div class="field"><label class="required">最影响使用的环节</label><textarea name="mostBlocking" required="" placeholder="请填写最影响效率或体验的环节">一些具体信息无法提供，就无法进行下一步，如果我这边进行回答就会影响最后整体输出效果</textarea></div><div class="field"><label>最满意的地方</label><textarea name="mostSatisfied"></textarea></div><div class="field"><label>最需要改进的地方</label><textarea name="improvement">有一些需要回答的内容偏离业务整体，需要调整：例如：未关闭P1前不会生成开发实现圆形，如果我提供相关信息就会偏离最开始的输出结果</textarea></div><div class="field"><label>其他主观建议</label><textarea name="other"></textarea></div></form><div class="actions"><span class="status">Codex兼容静态填写版｜填写完成后请截图或复制内容交回</span></div></main>
</body></html>
