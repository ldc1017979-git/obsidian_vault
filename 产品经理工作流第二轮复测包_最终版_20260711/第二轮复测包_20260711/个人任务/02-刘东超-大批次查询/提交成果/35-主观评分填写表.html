<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大批次查询｜主观评分填写表</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#303133;font:14px/1.6 "Microsoft YaHei",sans-serif}.top{height:58px;background:#1c53d9;color:#fff;display:flex;align-items:center;padding:0 28px}.top b{font-size:18px}.top span{margin-left:14px;opacity:.8}.wrap{max-width:1180px;margin:20px auto;padding:0 18px}.card{background:#fff;border:1px solid #e4e7ed;border-radius:6px;padding:22px;margin-bottom:16px}.head{display:flex;align-items:center;gap:12px}.head h1{font-size:22px;margin:0}.tag{color:#409eff;background:#ecf5ff;padding:3px 8px;border-radius:3px}.hint{color:#606266;margin:8px 0 0}.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}.field label{display:block;color:#606266;margin-bottom:5px}.field input,.field select,.remark{width:100%;border:1px solid #dcdfe6;border-radius:4px;padding:8px 10px;background:#fff}.section h2{font-size:17px;margin:0 0 12px}.score-row{display:grid;grid-template-columns:minmax(260px,1.7fr) 330px minmax(220px,1fr);gap:14px;align-items:center;padding:12px 0;border-top:1px solid #ebeef5}.score-row:first-of-type{border-top:0}.radios{display:flex;gap:8px}.radios label{width:54px;text-align:center;padding:5px;border:1px solid #dcdfe6;border-radius:4px;cursor:pointer}.radios label.checked{border-color:#409eff;background:#ecf5ff;color:#409eff}.radios input{margin-right:3px}.actions{position:sticky;bottom:0;background:#fff;border-top:1px solid #e4e7ed;padding:14px 0;display:flex;gap:10px;justify-content:flex-end}.btn{border:1px solid #dcdfe6;background:#fff;border-radius:4px;padding:8px 16px;cursor:pointer}.btn.primary{background:#409eff;border-color:#409eff;color:#fff}.status{margin-right:auto;color:#67c23a}@media(max-width:850px){.meta{grid-template-columns:1fr 1fr}.score-row{grid-template-columns:1fr}.radios{flex-wrap:wrap}}
</style></head><body><header class="top"><b>数智工厂 · 大批次查询</b><span>第二轮复测｜主观评分填写表</span></header><main class="wrap"><section class="card"><div class="head"><h1>主观评分</h1><span class="tag">由测试人员本人填写</span></div><p class="hint">1分表示很差，5分表示很好。所有答案仅保存在当前浏览器，点击“导出JSON”后再交回。</p><div class="meta"><div class="field"><label>项目</label><input value="大批次查询" readonly></div><div class="field"><label>评分人</label><input id="reviewer" value="东超"></div><div class="field"><label>日期</label><input id="date" type="date" value="2026-07-15"></div><div class="field"><label>工作流版本</label><input value="2026-07-11冻结版" readonly></div></div></section><form id="form"></form><section class="card"><label>总体评分补充说明</label><textarea id="overallNote" class="remark" rows="4" placeholder="请填写评分依据、明显优点或不足"></textarea></section><div class="actions"><span id="status" class="status">尚未填写</span><button class="btn" type="button" id="clear">清空本表</button><button class="btn" type="button" onclick="window.print()">打印</button><button class="btn primary" type="button" id="export">导出JSON</button></div></main><script>
const groups={"强引导能力":["是否默认进入详细引导版","是否没有开局丢长问卷","每轮是否只聚焦1-3个关键决策","是否提供选项、解释、推荐理由和影响","是否每轮说明当前结论和下一步"],"资料审计和分类":["是否先读原始资料再提问","是否区分已确认、推断、待确认和未找到","是否识别资料缺口及影响","是否避免资料不足时硬写PRD"],"系统基线适配":["是否选择正确的数智工厂基线","是否继承系统壳、导航、菜单和页签","是否保持Element Plus后台页面风格","是否避免营销页、大屏或装饰风"],"原型与质量门禁":["是否在PRD通过门禁后才生成原型","是否提前确认页面结构、视觉与交互矩阵","开发备注是否嵌入页面并支持搜索和定位","是否真实验证页面、控件、状态、角色和异常","是否明确标记未覆盖范围"]};
const key='batch-query-subjective-score-v1';const form=document.querySelector('#form');let idx=0;Object.entries(groups).forEach(([g,items])=>{const c=document.createElement('section');c.className='card section';c.innerHTML=`<h2>${g}</h2>`;items.forEach(q=>{idx++;const row=document.createElement('div');row.className='score-row';row.innerHTML=`<div>${idx}. ${q}</div><div class="radios">${[1,2,3,4,5].map(n=>`<label><input type="radio" name="q${idx}" value="${n}">${n}分</label>`).join('')}</div><input class="remark" name="q${idx}_note" placeholder="备注（可选）">`;c.appendChild(row)});form.appendChild(c)});
function data(){const fd=new FormData(form),scores={};for(const [k,v] of fd)scores[k]=v;return{project:'大批次查询',reviewer:document.querySelector('#reviewer').value,date:document.querySelector('#date').value,workflow:'2026-07-11冻结版',scores,overallNote:document.querySelector('#overallNote').value,savedAt:new Date().toISOString()}}function save(){try{localStorage.setItem(key,JSON.stringify(data()))}catch(e){}document.querySelector('#status').textContent='已自动保存'}function load(){let raw=null;try{raw=localStorage.getItem(key)}catch(e){}const d=JSON.parse(raw||'null');if(!d)return;document.querySelector('#reviewer').value=d.reviewer||'';document.querySelector('#date').value=d.date||'';document.querySelector('#overallNote').value=d.overallNote||'';Object.entries(d.scores||{}).forEach(([k,v])=>{const el=form.elements[k];if(!el)return;if(el instanceof RadioNodeList)el.value=v;else el.value=v});document.querySelector('#status').textContent='已恢复上次填写'}document.addEventListener('input',save);document.addEventListener('change',e=>{if(e.target.type==='radio'){document.querySelectorAll(`input[name="${e.target.name}"]`).forEach(x=>x.parentElement.classList.toggle('checked',x.checked))}});document.querySelector('#clear').onclick=()=>{if(confirm('确定清空本表的本地填写内容？')){try{localStorage.removeItem(key)}catch(e){}location.reload()}};document.querySelector('#export').onclick=()=>{save();const blob=new Blob([JSON.stringify(data(),null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='大批次查询-主观评分-东超.json';a.click();URL.revokeObjectURL(a.href)};load();
</script></body></html>
