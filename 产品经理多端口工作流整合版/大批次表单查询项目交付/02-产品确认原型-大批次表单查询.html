<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>产品确认原型 - 大批次表单查询</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Microsoft YaHei", Arial, sans-serif; color: #1f2937; background: #f3f5f8; font-size: 14px; }
    .app { height: 100vh; display: grid; grid-template-columns: 192px 1fr; grid-template-rows: 54px 34px 1fr; }
    .brand { grid-row: 1 / 3; background: #1f5bd8; color: #fff; display: flex; align-items: center; gap: 10px; padding: 0 22px; font-size: 20px; font-weight: 700; }
    .mark { width: 34px; height: 34px; border-radius: 6px; background: rgba(255,255,255,.22); display: grid; place-items: center; }
    .top { grid-column: 2; background: #fff; border-bottom: 1px solid #e5e7eb; display: flex; align-items: center; padding: 0 18px; gap: 24px; }
    .top span { color: #3f4652; }
    .top .active { color: #1d4ed8; font-weight: 600; padding: 17px 0 14px; border-bottom: 3px solid #2f7df6; }
    .search { margin-left: auto; width: 190px; height: 32px; border: 1px solid #dcdfe6; padding: 0 12px; color: #9aa3af; }
    .tabs { grid-column: 2; background: #fff; border-bottom: 1px solid #e5e7eb; display: flex; align-items: center; padding: 0 18px; gap: 8px; box-shadow: 0 2px 7px rgba(0,0,0,.06); }
    .tab { height: 26px; padding: 4px 12px; border: 1px solid #dcdfe6; background: #fff; display: flex; align-items: center; color: #4b5563; }
    .tab.active { color: #1d4ed8; border-color: #86b7ff; background: #eef6ff; }
    .side { grid-row: 3; background: #fff; border-right: 1px solid #e5e7eb; padding-top: 12px; }
    .menu { height: 44px; display: flex; align-items: center; padding: 0 28px; color: #374151; gap: 10px; }
    .menu.active { color: #1d4ed8; background: #eaf2ff; border-left: 4px solid #1d64e8; padding-left: 24px; }
    .main { grid-column: 2; grid-row: 3; padding: 20px 28px 34px; overflow: auto; }
    h1 { margin: 0 0 18px; font-size: 26px; color: #111827; }
    .panel { background: #fff; border: 1px solid #e5e7eb; padding: 16px 18px; margin-bottom: 14px; }
    .form { display: flex; align-items: end; gap: 18px; flex-wrap: wrap; }
    label { display: block; color: #4b5563; margin-bottom: 6px; }
    .required::before { content: "*"; color: #f56c6c; margin-right: 4px; }
    input, select { width: 180px; height: 32px; border: 1px solid #dcdfe6; padding: 0 10px; background: #fff; color: #374151; }
    button { height: 32px; padding: 0 16px; border: 1px solid #dcdfe6; background: #fff; color: #374151; cursor: pointer; }
    .primary { background: #409eff; border-color: #409eff; color: #fff; }
    .hint { color: #909399; font-size: 13px; margin-top: 10px; }
    .group { background: #fff; border: 1px solid #e5e7eb; margin-bottom: 12px; }
    .group-head { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; background: #f8fafc; border-bottom: 1px solid #e5e7eb; cursor: pointer; font-weight: 600; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    th, td { border-bottom: 1px solid #ebeef5; padding: 10px 8px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    th { background: #fafafa; color: #606266; font-weight: 600; }
    .tag { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 12px; border: 1px solid transparent; }
    .ok { color: #047857; background: #ecfdf5; border-color: #a7f3d0; }
    .draft { color: #6b7280; background: #f3f4f6; border-color: #d1d5db; }
    .reject { color: #b91c1c; background: #fef2f2; border-color: #fecaca; }
    .void { color: #92400e; background: #fffbeb; border-color: #fde68a; }
    .link { color: #1d64e8; background: transparent; border: 0; padding: 0; height: auto; }
    .disabled { color: #a8abb2; cursor: not-allowed; }
    .empty { background: #fff; border: 1px solid #e5e7eb; padding: 46px; text-align: center; color: #909399; display: none; }
    .pager { background: #fff; border: 1px solid #e5e7eb; border-top: 0; padding: 10px 14px; text-align: right; color: #606266; }
    .toast { position: fixed; top: 72px; left: 50%; transform: translateX(-50%); background: #fff; border: 1px solid #ebeef5; box-shadow: 0 4px 14px rgba(0,0,0,.14); padding: 10px 16px; display: none; }
  </style>
</head>
<body>
  <div class="app">
    <div class="brand"><div class="mark">数</div><div>数智工厂</div></div>
    <div class="top">
      <span>运营中心</span><span>仓储管理</span><span class="active">生产管理</span><span>质量管理</span><span>设备管理</span><span>数据中心</span><span>设置</span>
      <input class="search" value="请输入" readonly />
    </div>
    <div class="tabs"><div class="tab">工作台</div><div class="tab active">大批次表单查询 ×</div></div>
    <aside class="side">
      <div class="menu">生产计划</div><div class="menu">生产执行</div><div class="menu active">批次查询</div><div class="menu">生产报表</div><div class="menu">基础配置</div>
    </aside>
    <main class="main">
      <h1>大批次表单查询</h1>
      <section class="panel">
        <div class="form">
          <div><label class="required">大批次号</label><input id="batch" placeholder="请输入完整大批次号" /></div>
          <div><label>产线</label><select id="line"><option value="">全部</option><option>1号产线</option><option>2号产线</option></select></div>
          <div><label>班组</label><select id="team"><option value="">全部</option><option>A班组</option><option>B班组</option></select></div>
          <div><label>班次</label><select id="shift"><option value="">全部</option><option>早班</option><option>中班</option><option>夜班</option></select></div>
          <div><label>生产日期起</label><input id="dateStart" type="date" /></div>
          <div><label>生产日期止</label><input id="dateEnd" type="date" /></div>
          <button class="primary" onclick="query()">查询</button><button onclick="resetForm()">重置</button>
        </div>
        <div class="hint">大批次号必填，精确匹配；产线、班组、班次、生产日期范围用于缩小查询范围，均为选填。</div>
      </section>
      <section id="results"></section>
      <div id="empty" class="empty">未查询到该大批次号相关表单记录，请检查大批次号是否输入正确</div>
    </main>
  </div>
  <div id="toast" class="toast"></div>
  <script>
    const rows = [
      ["灌装工序记录","DC20260710001","SO-240710-001","已提交","张三","2026-07-10 10:32","A班组","早班","1号产线","2026-07-10",true],
      ["灌装工序记录","DC20260710001","SO-240710-001","草稿","李四","2026-07-10 09:58","A班组","早班","1号产线","2026-07-10",false],
      ["成品检验报告","DC20260710001","SO-240710-001","已完成","王五","2026-07-10 13:20","QA班组","中班","1号产线","2026-07-10",true],
      ["产品放行单","DC20260710001","SO-240710-001","已驳回","赵六","2026-07-10 15:06","QA班组","中班","1号产线","2026-07-10",true],
      ["清场记录（收班）","DC20260710001","SO-240710-001","已作废","钱七","2026-07-10 18:15","B班组","夜班","1号产线","2026-07-10",false]
    ];
    function cls(s){ return s==="已完成"||s==="已提交" ? "ok" : s==="草稿" ? "draft" : s==="已驳回" ? "reject" : "void"; }
    function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.style.display="block"; setTimeout(()=>t.style.display="none",1800); }
    function query(){
      const batch=document.getElementById("batch").value.trim();
      if(!batch){ toast("请输入大批次号"); return; }
      const start = document.getElementById("dateStart").value;
      const end = document.getElementById("dateEnd").value;
      let matched = batch==="DC20260710001" ? rows : [];
      matched = matched.filter(r => (!start || r[9] >= start) && (!end || r[9] <= end));
      render(matched);
    }
    function resetForm(){ ["batch","line","team","shift","dateStart","dateEnd"].forEach(id=>document.getElementById(id).value=""); document.getElementById("results").innerHTML=""; document.getElementById("empty").style.display="none"; }
    function render(data){
      const root=document.getElementById("results"); const empty=document.getElementById("empty"); root.innerHTML="";
      if(!data.length){ empty.style.display="block"; return; }
      empty.style.display="none";
      const groups = data.reduce((m,r)=>{ (m[r[0]] ||= []).push(r); return m; }, {});
      Object.entries(groups).sort().forEach(([name,list])=>{
        const box=document.createElement("div"); box.className="group";
        box.innerHTML=`<div class="group-head" onclick="this.nextElementSibling.hidden=!this.nextElementSibling.hidden"><span>${name}（${list.length}）</span><span>展开/收起</span></div>
        <div><table><thead><tr><th>表单名称</th><th>大批次号</th><th>订单号</th><th>状态</th><th>提交人</th><th>提交时间</th><th>班组</th><th>班次</th><th>产线</th><th>生产日期</th><th>操作</th></tr></thead><tbody>
        ${list.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td><span class="tag ${cls(r[3])}">${r[3]}</span></td><td>${r[4]}</td><td>${r[5]}</td><td>${r[6]}</td><td>${r[7]}</td><td>${r[8]}</td><td>${r[9]}</td><td>${r[10]?'<button class="link" onclick="toast(\\'已在 Tags-View 打开原表单详情页\\')">详情</button>':'<button class="link disabled" onclick="toast(\\'无该表单查看权限\\')">详情</button>'}</td></tr>`).join("")}
        </tbody></table></div>`;
        root.appendChild(box);
      });
      const pager=document.createElement("div"); pager.className="pager"; pager.textContent=`共 ${data.length} 条，整体分页规则待研发确认`; root.appendChild(pager);
    }
  </script>
</body>
</html>
