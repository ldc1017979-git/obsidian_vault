<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>访客配置页面原型 v11 - 流程图</title>
<style>
  :root {
    --bg: #f6f8fb;
    --panel: rgba(255,255,255,.88);
    --line: #9aa8bd;
    --text: #172033;
    --muted: #667085;
    --blue: #2f6fed;
    --green: #0f9f6e;
    --orange: #d98217;
    --red: #d64545;
    --purple: #7657d9;
    --border: #d8e0eb;
    --shadow: 0 12px 32px rgba(20,35,60,.12);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif;
    color: var(--text);
    background:
      linear-gradient(120deg, rgba(47,111,237,.08), transparent 34%),
      linear-gradient(280deg, rgba(15,159,110,.08), transparent 30%),
      var(--bg);
    min-height: 100vh;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 16px 22px;
    background: rgba(255,255,255,.86);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }
  h1 { margin: 0; font-size: 19px; letter-spacing: 0; }
  .sub { margin-top: 4px; font-size: 12px; color: var(--muted); }
  .tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button {
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover { border-color: var(--blue); color: var(--blue); }
  .wrap {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 340px;
    gap: 14px;
    padding: 14px;
    height: calc(100vh - 74px);
  }
  .canvas {
    position: relative;
    overflow: auto;
    background:
      linear-gradient(#e7edf5 1px, transparent 1px),
      linear-gradient(90deg, #e7edf5 1px, transparent 1px),
      rgba(255,255,255,.55);
    background-size: 28px 28px;
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: var(--shadow);
  }
  #stage {
    position: relative;
    width: 2120px;
    height: 1840px;
    transform-origin: 0 0;
  }
  svg {
    position: absolute;
    inset: 0;
    width: 2120px;
    height: 1840px;
    pointer-events: none;
    overflow: visible;
  }
  .node {
    position: absolute;
    width: 188px;
    min-height: 78px;
    padding: 11px 13px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 5px;
    background: var(--panel);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 8px 20px rgba(20,35,60,.09);
    cursor: grab;
    user-select: none;
  }
  .node:active { cursor: grabbing; }
  .node.active { outline: 3px solid rgba(47,111,237,.18); border-color: var(--blue); }
  .node .kicker {
    font-size: 11px;
    color: var(--muted);
    font-weight: 700;
    text-transform: uppercase;
  }
  .node .title { font-size: 15px; font-weight: 750; line-height: 1.25; }
  .node .desc { font-size: 12px; line-height: 1.35; color: var(--muted); }
  .node.start { border-color: rgba(47,111,237,.55); background: #eef5ff; }
  .node.end { border-color: rgba(15,159,110,.55); background: #eefbf6; }
  .node.config { border-color: rgba(118,87,217,.45); background: #f5f2ff; }
  .node.warn { border-color: rgba(217,130,23,.5); background: #fff7e8; }
  .node.risk { border-color: rgba(214,69,69,.5); background: #fff0f0; }
  .node.decision {
    width: 150px;
    min-height: 96px;
    border: 0;
    background: transparent;
    box-shadow: none;
    padding: 0;
  }
  .node.decision .diamond {
    position: absolute;
    inset: 10px 20px;
    background: #fff;
    border: 1.5px solid rgba(217,130,23,.58);
    transform: rotate(45deg);
    border-radius: 8px;
    box-shadow: 0 8px 20px rgba(20,35,60,.09);
  }
  .node.decision .title {
    position: relative;
    z-index: 1;
    margin: auto;
    width: 112px;
    text-align: center;
    font-size: 13px;
  }
  .lane {
    position: absolute;
    left: 28px;
    right: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    gap: 10px;
    color: #445168;
    font-weight: 800;
    font-size: 13px;
  }
  .lane::after { content: ""; flex: 1; border-top: 1px dashed #cbd5e1; }
  .edge-label {
    font-size: 12px;
    fill: #42526b;
    paint-order: stroke;
    stroke: white;
    stroke-width: 4px;
    stroke-linejoin: round;
  }
  .side {
    background: rgba(255,255,255,.88);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .side h2 { margin: 0; padding: 16px; font-size: 16px; border-bottom: 1px solid var(--border); }
  .side-body { padding: 14px 16px; overflow: auto; height: calc(100% - 53px); }
  .detail-title { font-size: 17px; font-weight: 800; margin-bottom: 8px; }
  .detail-meta { color: var(--muted); font-size: 12px; margin-bottom: 14px; }
  .detail-text { font-size: 13px; line-height: 1.75; white-space: pre-line; }
  .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 18px; }
  .tag { border: 1px solid var(--border); border-radius: 8px; padding: 8px; font-size: 12px; background: #fff; }
  .dot { display:inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
  @media (max-width: 900px) {
    .wrap { grid-template-columns: 1fr; height: auto; }
    .canvas { height: 72vh; }
    .side { min-height: 360px; }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>访客配置页面原型 v11 - 流程图</h1>
    <div class="sub">根据“访客管理配置中心”原型及基地车辆管理建议整理：登记、审批核销、差异化基地规则、排队叫号、卸货点与黑名单。</div>
  </div>
  <div class="tools">
    <button id="zoomOut">缩小</button>
    <button id="zoomIn">放大</button>
    <button id="reset">重置视图</button>
  </div>
</header>
<main class="wrap">
  <section class="canvas" id="canvas">
    <div id="stage">
      <div class="lane" style="top:18px">入口与模块导航</div>
      <div class="lane" style="top:238px">访客登记、审批、核销主业务流</div>
      <div class="lane" style="top:650px">安全学习与访客配置流</div>
      <div class="lane" style="top:970px">排队叫号与车辆进场流</div>
      <div class="lane" style="top:1240px">基础资料、卸货点、黑名单维护流</div>
      <div class="lane" style="top:1510px">基地提出的差异化车辆进出厂需求</div>
      <svg id="edges"></svg>
      <div id="nodes"></div>
    </div>
  </section>
  <aside class="side">
    <h2>节点详情</h2>
    <div class="side-body">
      <div id="detail">
        <div class="detail-title">点击节点查看说明</div>
        <div class="detail-meta">支持拖拽节点；双击节点可直接改名。</div>
        <div class="detail-text">这张图把原型中的多页配置中心拆成五条链路。主干是访客登记列表到新增、审批、详情、核销；配置侧包括基础配置、安全学习、出入核销、外部预审、排队叫号规则、卸货点、黑名单等。</div>
        <div class="legend">
          <div class="tag"><span class="dot" style="background:var(--blue)"></span>入口/开始</div>
          <div class="tag"><span class="dot" style="background:var(--purple)"></span>配置模块</div>
          <div class="tag"><span class="dot" style="background:var(--orange)"></span>判断/分支</div>
          <div class="tag"><span class="dot" style="background:var(--red)"></span>风险/拦截</div>
        </div>
      </div>
    </div>
  </aside>
</main>
<script>

  {id:"start", x:70, y:70, type:"start", kicker:"入口", title:"进入配置中心", desc:"访客管理配置中心", detail:"页面左侧为模块导航，默认进入访客登记列表。"},
  {id:"nav", x:330, y:70, kicker:"导航", title:"选择业务模块", desc:"基础配置 / 业务配置 / 排队叫号", detail:"导航包含访客登记、访客配置、访客基础配置、黑名单、卸货点配置、排队叫号管理，以及原型中展示的审批流程、登记字段、外部系统、人员权限、基地设置。"},
  {id:"biz", x:610, y:70, type:"decision", title:"进入哪条链路?"},
  {id:"visitorList", x:70, y:300, title:"访客登记列表", desc:"查询、重置、新增、详情", detail:"列表支持按访客姓名、单位、审核状态、基地组织等筛选。表格新增基地组织、审核状态列，操作列包含详情、外部审批、内部审批等入口。"},

  {id:"exitConfirm", x:1900, y:1570, type:"end", title:"出厂确认闭环", desc:"离场核对/登记出厂", detail:"广东要求安保执行进厂、出厂两次确认；湖北提出车辆离开由保安记录端记录。流程图需要补充车辆离场核对与出厂登记，形成进出闭环。"}

const edges = [
  ["start","nav","打开页面"], ["nav","biz","点击导航"],
  ["biz","visitorList","访客登记"], ["biz","security","访客配置"], ["biz","queue","排队叫号"], ["biz","base","基础/业务配置"],
  ["visitorList","addVisitor","新增访客"], ["addVisitor","saveVisitor","保存"], ["saveVisitor","addVisitor","否: 补充必填"], ["saveVisitor","backList","是"], ["backList","visitorList","返回列表"],
  ["visitorList","approvalStatus","查看操作"], ["approvalStatus","externalApproval","待外部审批"], ["approvalStatus","internalApproval","待内部审批"], ["approvalStatus","detail","已通过/详情"],
  ["externalApproval","detail","确认结果"], ["internalApproval","detail","发起后查看"], ["detail","verifyNeed","核销信息"], ["verifyNeed","verify","是"], ["verifyNeed","closed","否"], ["verify","closed","生成核销记录"], ["detail","material","发放物料"], ["material","closed","物料留痕"],
  ["security","visitorType","切换类型"], ["visitorType","orgSelect","配置"], ["orgSelect","agreement","下一项"], ["agreement","video","下一项"], ["video","quiz","下一项"], ["quiz","entryVerify","下一项"], ["entryVerify","preReview","可选"], ["preReview","saveConfig","保存"],
  ["queue","rule","配置规则"], ["queue","arrival","列表操作"], ["arrival","call","已到达"], ["arrival","noCall","未到达"], ["call","onsite","确认叫号"], ["onsite","waybill","关联/查看单号"], ["waybill","entryDetail","查看详情"],
  ["base","security","供访客配置引用"], ["unload","unloadEdit","新增/编辑"], ["unloadEdit","queue","供叫号选择"], ["blacklist","blackDecision","新增黑名单"], ["blackDecision","blackAdd","人员/车辆"], ["blacklist","blackRemove","详情解除"], ["blackAdd","blacklist","写入列表"], ["blackRemove","blacklist","移出列表"], ["other","nav","配置入口"],
  ["base","basePolicy","基地参数"], ["basePolicy","purposeConfig","配置目的"], ["purposeConfig","fieldByPurpose","按目的生成表单"], ["fieldByPurpose","approvalRoute","提交后判断"], ["approvalRoute","warehouseApproval","收发货/原料/成品"], ["approvalRoute","businessApproval","施工/访客/其它"], ["warehouseApproval","securityStudy","需要学习时"], ["businessApproval","securityStudy","施工/访客"], ["securityStudy","guardMode","审核学习进度"], ["guardMode","entryConfirm","有安保或仓管"], ["guardMode","weighRule","无安保节点"], ["entryConfirm","weighRule","确认进入"], ["weighRule","verify","启用地磅"], ["weighRule","skipWeigh","不启用"], ["skipWeigh","exitConfirm","APP/人工放行"], ["verify","exitConfirm","离场核对"]
];

const nodeLayer = document.getElementById("nodes");
const edgeSvg = document.getElementById("edges");
const detail = document.getElementById("detail");
let selected = null;
let scale = 1;

function renderNodes() {
  nodeLayer.innerHTML = "";
  nodes.forEach(n => {
    const el = document.createElement("div");
    el.className = "node " + (n.type || "");
    el.dataset.id = n.id;
    el.style.left = n.x + "px";
    el.style.top = n.y + "px";
    if (n.type === "decision") {
      el.innerHTML = '<div class="diamond"></div><div class="title">' + n.title + '</div>';
    } else {
      el.innerHTML = '<div class="kicker">' + (n.kicker || n.type || "步骤") + '</div><div class="title">' + n.title + '</div><div class="desc">' + (n.desc || "") + '</div>';
    }
    el.addEventListener("mousedown", startDrag);
    el.addEventListener("click", () => selectNode(n.id));
    el.addEventListener("dblclick", () => editNode(n.id));
    nodeLayer.appendChild(el);
  });
  drawEdges();
}

function center(n) {
  const w = n.type === "decision" ? 150 : 188;
  const h = n.type === "decision" ? 96 : 78;
  return {x:n.x + w / 2, y:n.y + h / 2};
}

function drawEdges() {
  edgeSvg.innerHTML = '<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#8492a6"></path></marker></defs>';
  edges.forEach(([s,t,label]) => {
    const a = nodes.find(n => n.id === s);
    const b = nodes.find(n => n.id === t);
    if (!a || !b) return;
    const p1 = center(a);
    const p2 = center(b);
    const dx = Math.max(40, Math.abs(p2.x - p1.x) * .38);
    const d = p2.x >= p1.x
      ? `M ${p1.x} ${p1.y} C ${p1.x + dx} ${p1.y}, ${p2.x - dx} ${p2.y}, ${p2.x} ${p2.y}`
      : `M ${p1.x} ${p1.y} C ${p1.x - dx} ${p1.y}, ${p2.x + dx} ${p2.y}, ${p2.x} ${p2.y}`;
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", d);
    path.setAttribute("fill", "none");
    path.setAttribute("stroke", "#8492a6");
    path.setAttribute("stroke-width", "2");
    path.setAttribute("marker-end", "url(#arrow)");
    edgeSvg.appendChild(path);
    if (label) {
      const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
      text.setAttribute("class", "edge-label");
      text.setAttribute("x", (p1.x + p2.x) / 2);
      text.setAttribute("y", (p1.y + p2.y) / 2 - 8);
      text.setAttribute("text-anchor", "middle");
      text.textContent = label;
      edgeSvg.appendChild(text);
    }
  });
}

function selectNode(id) {
  selected = id;
  document.querySelectorAll(".node").forEach(el => el.classList.toggle("active", el.dataset.id === id));
  const n = nodes.find(item => item.id === id);
  detail.innerHTML = '<div class="detail-title">' + n.title + '</div><div class="detail-meta">' + (n.kicker || n.type || "流程节点") + ' · ' + (n.desc || "判断/连接节点") + '</div><div class="detail-text">' + (n.detail || "无补充说明") + '</div>';
}

function editNode(id) {
  const n = nodes.find(item => item.id === id);
  const next = prompt("修改节点名称", n.title);
  if (next && next.trim()) {
    n.title = next.trim();
    renderNodes();
    selectNode(id);
  }
}

let drag = null;
function startDrag(e) {
  const id = e.currentTarget.dataset.id;
  const n = nodes.find(item => item.id === id);
  drag = {id, startX:e.clientX, startY:e.clientY, x:n.x, y:n.y};
  document.addEventListener("mousemove", onDrag);
  document.addEventListener("mouseup", endDrag);
}
function onDrag(e) {
  if (!drag) return;
  const n = nodes.find(item => item.id === drag.id);
  n.x = drag.x + (e.clientX - drag.startX) / scale;
  n.y = drag.y + (e.clientY - drag.startY) / scale;
  const el = document.querySelector('.node[data-id="' + drag.id + '"]');
  el.style.left = n.x + "px";
  el.style.top = n.y + "px";
  drawEdges();
}
function endDrag() {
  drag = null;
  document.removeEventListener("mousemove", onDrag);
  document.removeEventListener("mouseup", endDrag);
}

function applyZoom() {
  document.getElementById("stage").style.transform = "scale(" + scale + ")";
}
document.getElementById("zoomIn").onclick = () => { scale = Math.min(1.4, +(scale + .1).toFixed(2)); applyZoom(); };
document.getElementById("zoomOut").onclick = () => { scale = Math.max(.55, +(scale - .1).toFixed(2)); applyZoom(); };
document.getElementById("reset").onclick = () => {
  scale = 1;
  applyZoom();
  document.getElementById("canvas").scrollTo({left:0, top:0, behavior:"smooth"});
};

renderNodes();
</script>
