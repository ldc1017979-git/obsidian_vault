background:var(--purple-light);border-color:#C4B5FD}.node.warn{background:var(--orange-light);border-color:#FCD34D}.node.risk{background:var(--red-light);border-color:#FDA4AF}.node.end{background:var(--green-light);border-color:#86EFAC}.node.decision{background:#FFF; border-color:#F59E0B}.arrow{display:flex;align-items:center;justify-content:center;color:#9CA3AF;font-weight:800;font-size:20px;flex:0 0 22px}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.table th{background:#F9FAFB;color:var(--muted);font-size:12px;font-weight:800}.badge{display:inline-block;border-radius:999px;padding:3px 8px;font-size:12px;font-weight:700;white-space:nowrap}.badge.blue{background:var(--blue-light);color:#2563EB}.badge.green{background:var(--green-light);color:#047857}.badge.orange{background:var(--orange-light);color:#B45309}.badge.red{background:var(--red-light);color:#B91C1C}.badge.purple{background:var(--purple-light);color:#6D28D9}.matrix{display:grid;grid-template-columns:repeat(5,minmax(180px,1fr));gap:12px}.base-card{border:1px solid var(--line);border-radius:10px;padding:14px;background:#fff;min-height:170px}.base-card h4{margin:0 0 10px;font-size:15px;display:flex;justify-content:space-between;gap:8px}.base-card ul{padding-left:18px;margin:0;color:var(--muted);font-size:12px;line-height:1.8}.coverage-grid{display:grid;grid-template-columns:repeat(2,minmax(240px,1fr));gap:12px}.coverage{border:1px solid var(--line);border-radius:10px;padding:14px;background:#fff}.coverage h4{margin:0 0 8px}.coverage p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}.drawer-mask{position:fixed;inset:0;background:rgba(15,23,42,.28);z-index:50;display:none}.drawer-mask.show{display:block}.drawer{position:absolute;right:0;top:0;width:460px;max-width:100%;height:100%;background:#fff;box-shadow:-8px 0 26px rgba(15,23,42,.18);display:flex;flex-direction:column}.drawer-hd{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.drawer-hd h3{margin:0;font-size:18px}.drawer-bd{padding:20px;overflow:auto;flex:1}.drawer-ft{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}.switch-line{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:14px}.switch{width:44px;height:24px;border-radius:12px;background:#CBD5E1;position:relative;cursor:pointer}.switch:after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;background:#fff;border-radius:50%;transition:.15s}.switch.on{background:var(--blue)}.switch.on:after{left:23px}.modal{position:fixed;inset:0;background:rgba(15,23,42,.32);z-index:60;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.modal-box{width:620px;max-width:100%;background:#fff;border-radius:12px;box-shadow:0 18px 46px rgba(15,23,42,.22);overflow:hidden}.modal-hd{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.modal-hd h3{margin:0}.modal-bd{padding:20px}.modal-ft{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}.toast{position:fixed;right:24px;bottom:24px;background:#111827;color:#fff;border-radius:8px;padding:11px 14px;box-shadow:0 8px 22px rgba(0,0,0,.18);display:none;z-index:80;font-size:13px}.toast.show{display:block}@media(max-width:1180px){.stats,.form-grid,.matrix{grid-template-columns:1fr 1fr}.coverage-grid{grid-template-columns:1fr}}@media(max-width:760px){.sidebar{position:static;width:auto}.main{margin-left:0;padding:18px}.stats,.form-grid,.matrix{grid-template-columns:1fr}.top{display:block}.toolbar{margin-top:12px}.flow{min-width:100%;flex-direction:column}.arrow{transform:rotate(90deg)}}
</style>

<body>
<aside class="sidebar">
  <div class="logo"><h1>访客管理配置中心</h1><span>Vehicle Access Prototype</span></div>
  <div class="side-title">流程配置</div>
  <div class="side-item active" data-page="flow">车辆进出厂流程</div>
  <div class="side-item" data-page="field">进厂目的与字段</div>
  <div class="side-item" data-page="approval">审批路由</div>
  <div class="side-title">基地差异</div>
  <div class="side-item" data-page="base">基地规则</div>
  <div class="side-item" data-page="coverage">需求覆盖</div>
</aside>
<main class="main">
  <div class="top">
    <div class="title"><h2 id="page-title">车辆进出厂流程配置</h2><p id="page-subtitle">按基地、进厂目的、审批责任、地磅能力配置流程节点，点击卡片可编辑。</p></div>
    <div class="toolbar"><button class="btn" id="resetBtn">恢复示例</button><button class="btn primary" id="exportBtn">导出配置</button></div>
  </div>
  <section class="stats">
    <div class="stat"><div class="num" id="statNodes">0</div><div class="label">启用节点</div></div>
    <div class="stat"><div class="num" id="statBases">0</div><div class="label">适配基地</div></div>
    <div class="stat"><div class="num" id="statPurposes">0</div><div class="label">进厂目的</div></div>
    <div class="stat"><div class="num" id="statCoverage">0</div><div class="label">覆盖需求</div></div>
  </section>
  <section class="page active" id="page-flow">
    <div class="card"><div class="card-hd"><h3>流程参数</h3><span class="badge blue">可编辑</span></div><div class="card-bd"><div class="form-grid"><div class="field"><label>当前基地</label><select id="baseSelect" class="select"></select></div><div class="field"><label>进厂目的</label><select id="purposeSelect" class="select"></select></div><div class="field"><label>地磅规则</label><select id="weighRule" class="select"><option>按基地配置</option><option>启用地磅</option><option>不启用地磅</option></select></div><div class="field"><label>出厂确认</label><select id="exitRule" class="select"><option>必须确认</option><option>按基地配置</option><option>不需要</option></select></div></div></div></div>
    <div class="card"><div class="card-hd"><h3>主流程卡片</h3><button class="btn green" onclick="openNodeModal()">新增节点</button></div><div class="card-bd"><div class="flow-wrap"><div id="flow" class="flow"></div></div></div></div>
  </section>
  <section class="page" id="page-field"><div class="card"><div class="card-hd"><h3>进厂目的与字段配置</h3><button class="btn green" onclick="openPurposeModal()">新增目的</button></div><div class="card-bd"><table class="table"><thead><tr><th>进厂目的</th><th>默认审批</th><th>必填字段</th><th>选填字段</th><th>供应链带入</th><th>操作</th></tr></thead><tbody id="fieldRows"></tbody></table></div></div></section>
  <section class="page" id="page-approval"><div class="card"><div class="card-hd"><h3>审批路由配置</h3><span class="badge orange">按目的自动路由</span></div><div class="card-bd"><table class="table"><thead><tr><th>路由类型</th><th>适用目的</th><th>责任部门</th><th>基地要求</th></tr></thead><tbody id="approvalRows"></tbody></table></div></div></section>
  <section class="page" id="page-base"><div class="card"><div class="card-hd"><h3>基地差异化规则</h3><button class="btn green" onclick="openBaseModal()">新增基地</button></div><div class="card-bd"><div id="baseMatrix" class="matrix"></div></div></div></section>
  <section class="page" id="page-coverage"><div class="card"><div class="card-hd"><h3>Word 需求覆盖清单</h3><span class="badge green">验收用</span></div><div class="card-bd"><div id="coverageRows" class="coverage-grid"></div></div></div></section>
</main>
<div class="drawer-mask" id="drawerMask"><div class="drawer"><div class="drawer-hd"><h3 id="drawerTitle">编辑流程节点</h3><button class="btn" onclick="closeDrawer()">关闭</button></div><div class="drawer-bd"><div class="switch-line"><span>启用节点</span><div id="nodeSwitch" class="switch on"></div></div><div class="field"><label>节点名称</label><input id="editTitle" class="input"></div><br><div class="field"><label>节点说明</label><input id="editDesc" class="input"></div><br><div class="field"><label>节点类型</label><select id="editType" class="select"><option value="config">配置节点</option><option value="process">流程节点</option><option value="decision">判断节点</option><option value="warn">人工处理</option><option value="risk">异常/跳过</option><option value="end">结束节点</option></select></div><br><div class="field"><label>责任部门</label><select id="editOwner" class="select"><option>系统配置</option><option>仓储/仓管</option><option>储运部</option><option>业务对接部门</option><option>行政及需求部门</option><option>安保/记录端</option><option>司机/访客</option></select></div><br><div class="field"><label>适用基地</label><input id="editBases" class="input"></div><br><div class="field"><label>详细规则</label><textarea id="editDetail" class="textarea"></textarea></div></div><div class="drawer-ft"><button class="btn red" id="deleteNodeBtn" onclick="deleteNode()">删除</button><button class="btn" onclick="closeDrawer()">取消</button><button class="btn primary" onclick="saveNode()">保存</button></div></div></div>
<div class="modal" id="purposeModal"><div class="modal-box"><div class="modal-hd"><h3 id="purposeModalTitle">编辑进厂目的</h3><button class="btn" onclick="closePurposeModal()">关闭</button></div><div class="modal-bd"><div class="form-grid" style="grid-template-columns:1fr 1fr"><div class="field"><label>进厂目的</label><input id="purposeName" class="input"></div><div class="field"><label>默认审批</label><input id="purposeApproval" class="input"></div><div class="field"><label>必填字段</label><textarea id="purposeRequired" class="textarea"></textarea></div><div class="field"><label>选填字段</label><textarea id="purposeOptional" class="textarea"></textarea></div><div class="field" style="grid-column:1/-1"><label>供应链带入</label><input id="purposeSupply" class="input"></div></div></div><div class="modal-ft"><button class="btn" onclick="closePurposeModal()">取消</button><button class="btn primary" onclick="savePurpose()">保存</button></div></div></div>
<div class="modal" id="baseModal"><div class="modal-box"><div class="modal-hd"><h3>新增基地规则</h3><button class="btn" onclick="closeBaseModal()">关闭</button></div><div class="modal-bd"><div class="field"><label>基地名称</label><input id="baseName" class="input"></div><br><div class="field"><label>规则说明（一行一条）</label><textarea id="baseRules" class="textarea"></textarea></div></div><div class="modal-ft"><button class="btn" onclick="closeBaseModal()">取消</button><button class="btn primary" onclick="saveBase()">保存</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
const seed={bases:[{name:'贵州基地',rules:['无独立安保团队','保安节点替换为仓管','外来施工由行政及施工需求部门人工决策','删除同意放行冗余节点','不启用过磅称重']},{name:'福建基地',rules:['施工进场增加安全学习','进厂目的支持访客或基地自定义','取消物业保安核对车辆信息','仓储审核确认即可进入']},{name:'广东基地',rules:['新增一般访客车辆类目','收发货由仓储全权审批','施工和访客由业务对接部门审批','进厂和出厂两次确认']},{name:'北京基地',rules:['安全须知可编辑并支持视频上传','预约含送货/发货/施工/访客四类','各类型字段必填选填可配置','无地磅时 APP 核验后放行']},{name:'湖北基地',rules:['统一到访客登记，人员有车时包含车辆登记','目的含原材料配送/成品发运及自定义','原料/成品默认储运部确认','供应链入口跳转预约登记并带入订单信息','车辆离开由记录端登记']}],purposes:[{name:'送货',approval:'仓储/储运部',required:'所属公司、车牌号、司机信息、送货单号',optional:'物资信息、备注',supply:'公司、目的、订单号、物资信息'},{name:'发货',approval:'仓储/储运部',required:'所属公司、车牌号、提货单号',optional:'物资信息、备注',supply:'公司、目的、订单号、物资信息'},{name:'外来施工',approval:'业务对接部门/行政及需求部门',required:'施工单位、联系人、施工区域、安全学习',optional:'送货单号、车辆附件',supply:'无'},{name:'一般访客',approval:'业务对接责任部门',required:'访客姓名、单位、接待部门、来访事由',optional:'车牌号、人脸、随行人员',supply:'无'},{name:'自定义目的',approval:'基地自定义',required:'按基地字段配置',optional:'按基地字段配置',supply:'可配置'}],nodes:[{id:'register',type:'process',title:'预约登记入口',desc:'访客或供应链跳转进入',owner:'司机/访客',bases:'全部',enabled:true,detail:'供应链入口跳转预约登记，自动带入所属公司、来访目的、订单号、物资信息到备注。'},{id:'purpose',type:'config',title:'选择进厂目的',desc:'送货/发货/施工/访客/自定义',owner:'系统配置',bases:'全部',enabled:true,detail:'支持四类通行类型、一般访客车辆、原材料配送、成品发运及基地自定义目的。'},{id:'fields',type:'config',title:'动态字段表单',desc:'按目的控制必填/选填',owner:'系统配置',bases:'全部',enabled:true,detail:'不同目的生成不同字段要求，例如施工业务无需填送货单。'},{id:'study',type:'config',title:'安全学习',desc:'文字/PPT/视频/进度',owner:'业务对接部门',bases:'福建、北京、施工类可配置',enabled:true,detail:'施工进场增加安全学习，基地可编辑安全须知并上传视频，业务部门查看进度后审核。'},{id:'route',type:'decision',title:'按目的路由审批',desc:'仓储或业务部门',owner:'系统配置',bases:'全部',enabled:true,detail:'收发货、原材料配送、成品发运默认仓储或储运审批；施工、访客、其它目的由业务部门审批。'},{id:'warehouse',type:'warn',title:'仓储/仓管审核',desc:'收发货、原料、成品',owner:'仓储/仓管',bases:'贵州、福建、广东、湖北',enabled:true,detail:'贵州可用仓管替代保安；福建仓储审核确认即可进入；广东收发货由仓储审批。'},{id:'business',type:'warn',title:'业务部门审核',desc:'施工、访客、其它',owner:'业务对接部门',bases:'贵州、广东、北京、湖北',enabled:true,detail:'外来施工、访客由业务对接责任部门审核，贵州外来施工由行政及施工需求部门人工决策。'},{id:'entry',type:'warn',title:'进厂确认',desc:'安保/仓管/APP 核验',owner:'安保/记录端',bases:'按基地配置',enabled:true,detail:'广东保留进厂确认；北京 APP 核验后直接放行；福建取消物业保安核对；贵州保安替换为仓管。'},{id:'queue',type:'process',title:'排队叫号',desc:'门、卸货点、时段',owner:'仓储/仓管',bases:'有车辆排队基地',enabled:true,detail:'选择进入门后级联卸货点，确认叫号后同步到访客记录。'},{id:'weigh',type:'decision',title:'是否启用地磅',desc:'基地能力判断',owner:'系统配置',bases:'按基地配置',enabled:true,detail:'贵州删除过磅称重，北京无地磅；地磅是可配置节点，不作为强制流程。'},{id:'exit',type:'end',title:'出厂确认闭环',desc:'离场核对并登记出厂',owner:'安保/记录端',bases:'广东、湖北及可配置基地',enabled:true,detail:'广东要求进厂、出厂两次确认；湖北车辆离开由记录端登记。'},{id:'blacklist',type:'risk',title:'黑名单拦截',desc:'登录和登记拦截',owner:'系统配置',bases:'全部',enabled:true,detail:'对人员或车辆黑名单执行登录和现场登记拦截。'}],coverage:[['贵州','保安节点替换为仓管、删除过磅','进厂确认 / 是否启用地磅','已覆盖'],['福建','施工安全学习、取消物业保安核对','安全学习 / 仓储审核','已覆盖'],['广东','一般访客车辆、分类审批、两次确认','进厂目的 / 审批路由 / 出厂确认','已覆盖'],['北京','四类通行、字段配置、安全须知视频、无地磅放行','字段配置 / 安全学习 / 地磅配置','已覆盖'],['湖北','统一预约登记、供应链带入、离开记录','预约入口 / 动态字段 / 出厂确认','已覆盖']]};
let state=load(),editing=null,editingPurpose=-1;function load(){try{return JSON.parse(localStorage.getItem('vehicleAccessPrototypeV3'))||structuredClone(seed)}catch(e){return structuredClone(seed)}}function save(){localStorage.setItem('vehicleAccessPrototypeV3',JSON.stringify(state))}function $(id){return document.getElementById(id)}function render(){renderStats();renderSelectors();renderFlow();renderFields();renderApproval();renderBases();renderCoverage()}function renderStats(){$('statNodes').textContent=state.nodes.filter(n=>n.enabled).length;$('statBases').textContent=state.bases.length;$('statPurposes').textContent=state.purposes.length;$('statCoverage').textContent=state.coverage.length}function renderSelectors(){$('baseSelect').innerHTML=state.bases.map(b=>'<option>'+esc(b.name)+'</option>').join('');$('purposeSelect').innerHTML=state.purposes.map(p=>'<option>'+esc(p.name)+'</option>').join('')}function renderFlow(){let html='';state.nodes.forEach((n,i)=>{html+='<div class="node '+esc(n.type)+(n.enabled?'':' disabled')+'" onclick="openNode(\''+n.id+'\')"><div class="k">'+esc(n.owner)+'</div><div class="t">'+esc(n.title)+'</div><div class="d">'+esc(n.desc)+'</div></div>';if(i<state.nodes.length-1)html+='<div class="arrow">→</div>'});$('flow').innerHTML=html}function renderFields(){$('fieldRows').innerHTML=state.purposes.map((p,i)=>'<tr><td><b>'+esc(p.name)+'</b></td><td>'+esc(p.approval)+'</td><td>'+esc(p.required)+'</td><td>'+esc(p.optional)+'</td><td>'+esc(p.supply)+'</td><td><button class="btn" onclick="openPurposeModal('+i+')">编辑</button></td></tr>').join('')}function renderApproval(){let rows=[['仓储/仓管审核','送货、发货、原材料配送、成品发运','仓储/仓管/储运部','贵州替换保安；福建仓储确认；广东收发货全权审批；湖北储运默认确认'],['业务部门审核','外来施工、一般访客、自定义目的','业务对接部门/行政及需求部门','贵州施工人工决策；广东施工访客业务审批；北京可选对接部门'],['安保/记录端确认','进厂、出厂、APP核验','安保/记录端/仓管','广东两次确认；北京 APP 核验；湖北离开记录']];$('approvalRows').innerHTML=rows.map(r=>'<tr><td><span class="badge orange">'+esc(r[0])+'</span></td><td>'+esc(r[1])+'</td><td>'+esc(r[2])+'</td><td>'+esc(r[3])+'</td></tr>').join('')}function renderBases(){$('baseMatrix').innerHTML=state.bases.map((b,i)=>'<div class="base-card"><h4>'+esc(b.name)+' <button class="btn ghost" onclick="deleteBase('+i+')">删除</button></h4><ul>'+b.rules.map(r=>'<li>'+esc(r)+'</li>').join('')+'</ul></div>').join('')}function renderCoverage(){$('coverageRows').innerHTML=state.coverage.map(r=>'<div class="coverage"><h4>'+esc(r[0])+' <span class="badge green">'+esc(r[3])+'</span></h4><p><b>需求点：</b>'+esc(r[1])+'<br><b>配置落点：</b>'+esc(r[2])+'</p></div>').join('')}function nav(page){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));$('page-'+page).classList.add('active');document.querySelectorAll('.side-item').forEach(i=>i.classList.toggle('active',i.dataset.page===page));let map={flow:['车辆进出厂流程配置','按基地、进厂目的、审批责任、地磅能力配置流程节点，点击卡片可编辑。'],field:['进厂目的与字段','按进厂目的配置必填/选填字段与供应链带入信息。'],approval:['审批路由','配置不同进厂目的对应的审批责任部门。'],base:['基地规则','展示并维护各基地提出的差异化车辆管理要求。'],coverage:['需求覆盖','对照 Word 文档检查基地需求是否覆盖。']};$('page-title').textContent=map[page][0];$('page-subtitle').textContent=map[page][1]}document.querySelectorAll('.side-item').forEach(i=>i.onclick=()=>nav(i.dataset.page));function openNode(id){editing=state.nodes.find(n=>n.id===id);$('drawerTitle').textContent='编辑流程节点';$('deleteNodeBtn').style.display='inline-flex';fillNode()}function openNodeModal(){editing={id:'node_'+Date.now(),type:'process',title:'新增节点',desc:'待配置',owner:'系统配置',bases:'全部',enabled:true,detail:'请填写节点规则'};$('drawerTitle').textContent='新增流程节点';$('deleteNodeBtn').style.display='none';fillNode()}function fillNode(){$('nodeSwitch').classList.toggle('on',editing.enabled);$('editTitle').value=editing.title;$('editDesc').value=editing.desc;$('editType').value=editing.type;$('editOwner').value=editing.owner;$('editBases').value=editing.bases;$('editDetail').value=editing.detail;$('drawerMask').classList.add('show')}function closeDrawer(){$('drawerMask').classList.remove('show')}$('nodeSwitch').onclick=()=>$('nodeSwitch').classList.toggle('on');function saveNode(){if(!editing)return;editing.enabled=$('nodeSwitch').classList.contains('on');editing.title=$('editTitle').value.trim()||'未命名节点';editing.desc=$('editDesc').value.trim();editing.type=$('editType').value;editing.owner=$('editOwner').value;editing.bases=$('editBases').value.trim();editing.detail=$('editDetail').value.trim();let idx=state.nodes.findIndex(n=>n.id===editing.id);if(idx>=0)state.nodes[idx]=editing;else state.nodes.push(editing);save();render();closeDrawer();toast('节点已保存')}function deleteNode(){if(!editing)return;if(confirm('确定删除该流程节点？')){state.nodes=state.nodes.filter(n=>n.id!==editing.id);save();render();closeDrawer();toast('节点已删除')}}function openPurposeModal(i){editingPurpose=typeof i==='number'?i:-1;let p=editingPurpose>=0?state.purposes[editingPurpose]:{name:'',approval:'',required:'',optional:'',supply:''};$('purposeModalTitle').textContent=editingPurpose>=0?'编辑进厂目的':'新增进厂目的';$('purposeName').value=p.name;$('purposeApproval').value=p.approval;$('purposeRequired').value=p.required;$('purposeOptional').value=p.optional;$('purposeSupply').value=p.supply;$('purposeModal').classList.add('show')}function closePurposeModal(){$('purposeModal').classList.remove('show')}function savePurpose(){let p={name:$('purposeName').value.trim()||'未命名目的',approval:$('purposeApproval').value.trim(),required:$('purposeRequired').value.trim(),optional:$('purposeOptional').value.trim(),supply:$('purposeSupply').value.trim()};if(editingPurpose>=0)state.purposes[editingPurpose]=p;else state.purposes.push(p);save();render();closePurposeModal();toast('进厂目的已保存')}function openBaseModal(){$('baseName').value='';$('baseRules').value='';$('baseModal').classList.add('show')}function closeBaseModal(){$('baseModal').classList.remove('show')}function saveBase(){let name=$('baseName').value.trim();if(!name){toast('请填写基地名称');return}let rules=$('baseRules').value.split('\n').map(x=>x.trim()).filter(Boolean);state.bases.push({name,rules:rules.length?rules:['待补充规则']});save();render();closeBaseModal();toast('基地规则已新增')}function deleteBase(i){if(confirm('确定删除该基地规则？')){state.bases.splice(i,1);save();render();toast('基地规则已删除')}}function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800)}function esc(s){return String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}$('resetBtn').onclick=()=>{if(confirm('恢复示例配置？当前浏览器内修改会被清空。')){state=structuredClone(seed);save();render();toast('已恢复示例')}};$('exportBtn').onclick=()=>{let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='车辆进出厂流程配置.json';a.click();URL.revokeObjectURL(a.href)};render();
</script>
